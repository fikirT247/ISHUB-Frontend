<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework 3</title>
    <style>

ul {
    padding: 0;
    list-style: none;
    width: 250px;
}

li {
    cursor: pointer;
    padding: 10px;
    margin-bottom: 8px;
    border-bottom: 1px solid #ddd;
    color: hsl(285, 89%, 15%);
    font-family: Arial, Helvetica, sans-serif;
    transition: background-color 0.2s;
}

li:hover {
    background-color: #f0e6f5;
}

.done {
    text-decoration: line-through;
    color: #888;
}

h1{
    font-family: Arial, Helvetica, sans-serif;
    color: hsl(232, 86%, 9%);
}
    </style>    
</head>
<body>
    <h1>To-Do List</h1>
    <ul>
        <li onclick="toggleTask(this)">Studying</li>
        <li onclick="toggleTask(this)">Clean House</li>
        <li onclick="toggleTask(this)">Watch a movie</li>
    </ul>

    <script>
        function toggleTask(task) {
            task.classList.toggle("done");
        }
    </script>
</body>
</html>
