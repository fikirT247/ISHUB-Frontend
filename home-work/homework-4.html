<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Howework 4</title>
    <style>

        div {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .buttons {
            display: flex;
            gap: 20px;
        }
        h1 {
            font-family: Arial, Helvetica, sans-serif;
            color: hsl(232, 86%, 9%);
        }
        h2 {
            font-family: Arial, Helvetica, sans-serif;
            color: hsl(232, 86%, 9%);
            margin-bottom: 40px;
            font-size: 48px;
        }

        button {
            padding: 15px 15px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            background-color: hsl(273, 40%, 65%);
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div>
        <h1>Counter</h1>
        <h2 id="count">0</h2>
        <section class="buttons">
            <button onclick="increase()">+</button>
            <button onclick="decrease()">-</button>
        </section>
    </div>

    <script>
        let count = 0;

        function increase() {
            count++;

            document.getElementById("count").textContent = count;
        }

        function decrease() {
            if (count > 0) {
                count--;
                document.getElementById("count").textContent = count;
            }

        }
    </script>
</body>
</html>
