<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework 1</title>
    <style>
        p {
            cursor: pointer;
            color: hsl(285, 89%, 15%);
            font-family:Arial, Helvetica, sans-serif;
            font-size: 20px;
            line-height: 1.5;
        }

        button {
            padding: 5px 5px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            background-color: hsl(273, 40%, 65%);
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <p id="message">Click Me!</p>

    <button onclick="changeText()">Change Text</button>
    <button onclick="changeColor()">Change Color</button>
    <script>
            function changeText() {
                        document.getElementById("message").textContent = "Oh! You did!";
            }

            function changeColor() {
                        document.getElementById("message").style.color = "purple";
            }
           
    </script>
</body>
</html>
